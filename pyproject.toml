[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spacesweep"
dynamic = ["version"]
description = "Free up disk space on Windows without guessing what is safe to delete."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pywebview>=5.0"]

[project.scripts]
spacesweep = "spacesweep.__main__:main"

[tool.setuptools]
packages = ["spacesweep"]

[tool.setuptools.dynamic]
version = { attr = "spacesweep.__version__" }

[tool.setuptools.package-data]
spacesweep = ["ui/*", "ui/pages/*", "CHANGELOG.md"]
