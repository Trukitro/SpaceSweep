name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -v
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem spacesweep/ui -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE) { exit 1 }
          }

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Portable exe
        shell: pwsh
        run: .\build.ps1 -OneFile
      - name: Installer
        shell: pwsh
        run: .\build.ps1 -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceSweep-${{ github.sha }}
          path: |
            dist/SpaceSweep.exe
            dist/SpaceSweepSetup.exe
          if-no-files-found: error
