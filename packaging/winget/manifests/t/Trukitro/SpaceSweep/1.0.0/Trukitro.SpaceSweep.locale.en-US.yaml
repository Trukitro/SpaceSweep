ShortDescription: Free up disk space on Windows without guessing what is safe to delete.
Description: |-
  SpaceSweep finds caches, leftovers, duplicates, forgotten games and big files, and explains in plain language what each thing is,
  what happens if you delete it and what you should never touch. Includes a "free N GB" assistant, transparent NTFS compression,
  space history, Downloads organizer, similar-photo finder, moving folders to another drive and automatic upkeep. Spanish and English.
