<div class="app">
  <aside class="side">
    <div class="brand"><img src="logo.svg" alt=""><div><b>SpaceSweep</b><small id="version"></small></div></div>
    <button class="nav active" data-page="home"><svg class="ic"><use href="#i-home"/></svg><span data-t="nav.home"></span></button>
    <div class="nav-group" data-t="nav.g_free"></div>
    <button class="nav" data-page="cleanup"><svg class="ic"><use href="#i-sweep"/></svg><span data-t="nav.cleanup"></span></button>
    <button class="nav" data-page="projects"><svg class="ic"><use href="#i-code"/></svg><span data-t="proj.nav"></span></button>
    <button class="nav" data-page="programs"><svg class="ic"><use href="#i-app"/></svg><span data-t="prog.nav"></span></button>
    <button class="nav" data-page="games"><svg class="ic"><use href="#i-game"/></svg><span data-t="games.nav"></span></button>
    <button class="nav" data-page="devtools"><svg class="ic"><use href="#i-brain"/></svg><span data-t="dev.nav"></span></button>
    <button class="nav" data-page="duplicates"><svg class="ic"><use href="#i-copy"/></svg><span data-t="nav.duplicates"></span></button>

    <div class="nav-group" data-t="nav.g_understand"></div>
    <button class="nav" data-page="explorer"><svg class="ic"><use href="#i-pie"/></svg><span data-t="nav.explorer"></span></button>
    <button class="nav" data-page="history"><svg class="ic"><use href="#i-history"/></svg><span data-t="hist.nav"></span></button>

    <button class="nav" data-page="downloads"><svg class="ic"><use href="#i-download"/></svg><span data-t="nav.downloads"></span></button>
    <button class="nav" data-page="folders"><svg class="ic"><use href="#i-folder"/></svg><span data-t="nav.folders"></span></button>
    <button class="nav" data-page="move"><svg class="ic"><use href="#i-disk"/></svg><span data-t="mv.nav"></span></button>
    <div class="nav-group" data-t="nav.g_keep"></div>
    <button class="nav" data-page="auto"><svg class="ic"><use href="#i-clock"/></svg><span data-t="auto.nav"></span></button>
    <div class="side-foot">
      <div class="admin-pill" id="adminPill"><span class="dot"></span><span id="adminText"></span></div>
      <button class="btn sm hidden" id="btnAdmin"><svg class="ic"><use href="#i-shield"/></svg><span data-t="admin.relaunch"></span></button>
      <div class="seg" id="langSeg"><button data-lang="es">Español</button><button data-lang="en">English</button></div>
      <div class="seg" id="themeSeg"><button data-theme="system" data-t="theme.system"></button><button data-theme="light" data-t="theme.light"></button><button data-theme="dark" data-t="theme.dark"></button></div>
    </div>
  </aside>

  <main class="main">

    <section class="page" id="page-cleanup"></section>
    <section class="page" id="page-explorer"></section>
    <section class="page" id="page-downloads"></section>
    <section class="page" id="page-folders"></section>
    <section class="page" id="page-duplicates"></section>
    <section class="page" id="page-history"></section>

    <section class="page" id="page-photos"></section>
